version: '3.8'

services:
  # Backend Service - Node.js Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techblog-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Persist database
      - backend-data:/app/data
      # Mount database to data directory
      - ./backend/blog.db:/app/blog.db
    networks:
      - techblog-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Frontend Service - React.js with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techblog-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - techblog-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# Networks
networks:
  techblog-network:
    driver: bridge

# Volumes
volumes:
  backend-data:
    driver: local

